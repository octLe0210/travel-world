<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅游产品搜索 - 世界之旅</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: #f0f2f5; color: #333; min-height: 100vh; }
.app-header { background: linear-gradient(135deg, #2c3e50, #34495e); color: #fff; padding: 28px 24px; text-align: center; }
.app-header h1 { font-size: 26px; font-weight: 800; }
.app-header p { font-size: 14px; opacity: 0.7; margin-top: 4px; }
.layout { max-width: 1200px; margin: 0 auto; padding: 28px 24px; display: grid; grid-template-columns: 260px 1fr; gap: 28px; }

/* Filters */
.filters { background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); height: fit-content; position: sticky; top: 24px; }
.filters h3 { font-size: 16px; font-weight: 700; color: #2c3e50; margin-bottom: 20px; }
.filter-group { margin-bottom: 22px; }
.filter-group label { display: block; font-size: 13px; font-weight: 600; color: #666; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.filter-group select, .filter-group input { width: 100%; padding: 10px 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; outline: none; }
.filter-group select:focus, .filter-group input:focus { border-color: #f39c12; }
.price-range { display: flex; gap: 10px; align-items: center; }
.price-range input { flex: 1; }
.price-range span { color: #999; font-size: 13px; }
.checkbox-group { display: flex; flex-direction: column; gap: 8px; }
.checkbox-group label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #555; cursor: pointer; text-transform: none; letter-spacing: 0; font-weight: 400; }
.checkbox-group input { width: auto; }
.filter-btn { width: 100%; padding: 12px; background: #f39c12; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
.filter-btn:hover { background: #e67e22; }

/* Results */
.results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.results-header .count { font-size: 15px; color: #888; }
.results-header .sort select { padding: 8px 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 13px; outline: none; }
.result-list { display: flex; flex-direction: column; gap: 14px; }
.result-card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); display: flex; gap: 18px; transition: transform 0.2s; }
.result-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
.result-card img { width: 200px; height: 150px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
.result-info { flex: 1; display: flex; flex-direction: column; }
.result-info h3 { font-size: 19px; color: #2c3e50; margin-bottom: 4px; }
.result-info .desc { font-size: 13px; color: #888; margin-bottom: 10px; line-height: 1.5; }
.result-meta { display: flex; gap: 16px; margin-top: auto; font-size: 13px; color: #999; }
.result-meta span { display: flex; align-items: center; gap: 4px; }
.result-price { text-align: right; display: flex; flex-direction: column; justify-content: flex-end; }
.result-price .price { font-size: 26px; font-weight: 800; color: #e74c3c; }
.result-price .unit { font-size: 12px; color: #999; }
.result-price button { margin-top: 8px; padding: 10px 20px; background: #f39c12; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
.result-price button:hover { background: #e67e22; }
.no-results { text-align: center; padding: 60px 20px; color: #999; }

@media (max-width: 767px) {
  .layout { grid-template-columns: 1fr; }
  .filters { position: static; }
  .result-card { flex-direction: column; }
  .result-card img { width: 100%; height: 200px; }
  .result-price { flex-direction: row; align-items: center; justify-content: space-between; margin-top: 12px; }
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

const destinations = ['全部', '巴黎，法国', '马尔代夫', '东京，日本', '冰岛', '巴厘岛，印尼', '纽约，美国'];
const dayOptions = [3, 5, 7, 10, 14];

const mockData = [
  { id: 1, img: 'https://picsum.photos/seed/pkg1/400/300', title: '巴黎浪漫之旅', desc: '埃菲尔铁塔登顶 + 卢浮宫深度游 + 塞纳河晚宴', dest: '巴黎，法国', days: 7, price: 12999 },
  { id: 2, img: 'https://picsum.photos/seed/pkg2/400/300', title: '马尔代夫蜜月套餐', desc: '水上别墅4晚 + 全包餐饮 + 浮潜出海 + SPA体验', dest: '马尔代夫', days: 5, price: 25999 },
  { id: 3, img: 'https://picsum.photos/seed/pkg3/400/300', title: '东京深度自由行', desc: '浅草寺 + 秋叶原 + 迪士尼 + 箱根温泉一日游', dest: '东京，日本', days: 7, price: 8999 },
  { id: 4, img: 'https://picsum.photos/seed/pkg4/400/300', title: '冰岛环岛自驾', desc: '蓝湖温泉 + 黄金圈 + 冰河湖 + 极光追猎', dest: '冰岛', days: 10, price: 32999 },
  { id: 5, img: 'https://picsum.photos/seed/pkg5/400/300', title: '巴厘岛瑜伽静修', desc: '乌布山谷酒店 + 每日瑜伽课 + 梯田徒步 + 精油SPA', dest: '巴厘岛，印尼', days: 7, price: 6999 },
  { id: 6, img: 'https://picsum.photos/seed/pkg6/400/300', title: '纽约城市漫游', desc: '自由女神 + 帝国大厦 + 百老汇 + 中央公园骑行', dest: '纽约，美国', days: 5, price: 15999 },
  { id: 7, img: 'https://picsum.photos/seed/pkg7/400/300', title: '巴黎艺术之旅', desc: '奥赛博物馆 + 橘园美术馆 + 蒙马特艺术区探访', dest: '巴黎，法国', days: 5, price: 10999 },
  { id: 8, img: 'https://picsum.photos/seed/pkg8/400/300', title: '东京美食之旅', desc: '筑地市场 + 米其林餐厅 + 居酒屋体验 + 寿司制作课', dest: '东京，日本', days: 5, price: 7999 },
  { id: 9, img: 'https://picsum.photos/seed/pkg9/400/300', title: '马尔代夫家庭度假', desc: '家庭双卧别墅 + 儿童俱乐部 + 海豚巡航 + 无人岛野餐', dest: '马尔代夫', days: 7, price: 35999 },
  { id: 10, img: 'https://picsum.photos/seed/pkg10/400/300', title: '纽约+华盛顿联游', desc: '双城连线 + 博物馆深度 + 名校探访 + 购物之旅', dest: '纽约，美国', days: 10, price: 21999 },
];

function App() {
  const [dest, setDest] = useState('全部');
  const [minPrice, setMinPrice] = useState(0);
  const [maxPrice, setMaxPrice] = useState(50000);
  const [selDays, setSelDays] = useState([]);
  const [sort, setSort] = useState('default');

  const toggleDay = (d) => {
    setSelDays(prev => prev.includes(d) ? prev.filter(x => x !== d) : [...prev, d]);
  };

  const reset = () => {
    setDest('全部'); setMinPrice(0); setMaxPrice(50000); setSelDays([]); setSort('default');
  };

  const results = useMemo(() => {
    let list = mockData.filter(item => {
      if (dest !== '全部' && item.dest !== dest) return false;
      if (item.price < minPrice || item.price > maxPrice) return false;
      if (selDays.length > 0 && !selDays.includes(item.days)) return false;
      return true;
    });
    if (sort === 'price-asc') list.sort((a, b) => a.price - b.price);
    else if (sort === 'price-desc') list.sort((a, b) => b.price - a.price);
    else if (sort === 'days') list.sort((a, b) => a.days - b.days);
    return list;
  }, [dest, minPrice, maxPrice, selDays, sort]);

  return (
    <div>
      <div className="app-header">
        <h1>发现你的旅行</h1>
        <p>搜索并筛选最适合你的旅游产品</p>
      </div>
      <div className="layout">
        {/* Filters */}
        <aside className="filters">
          <h3>筛选条件</h3>
          <div className="filter-group">
            <label>目的地</label>
            <select value={dest} onChange={e => setDest(e.target.value)}>
              {destinations.map(d => <option key={d} value={d}>{d}</option>)}
            </select>
          </div>
          <div className="filter-group">
            <label>价格区间（元）</label>
            <div className="price-range">
              <input type="number" value={minPrice} onChange={e => setMinPrice(+e.target.value)} min={0} />
              <span>—</span>
              <input type="number" value={maxPrice} onChange={e => setMaxPrice(+e.target.value)} min={0} />
            </div>
          </div>
          <div className="filter-group">
            <label>出行天数</label>
            <div className="checkbox-group">
              {dayOptions.map(d => (
                <label key={d}><input type="checkbox" checked={selDays.includes(d)} onChange={() => toggleDay(d)} /> {d} 天</label>
              ))}
            </div>
          </div>
          <button className="filter-btn" onClick={reset}>重置筛选</button>
        </aside>

        {/* Results */}
        <main>
          <div className="results-header">
            <span className="count">共 {results.length} 个产品</span>
            <div className="sort">
              <select value={sort} onChange={e => setSort(e.target.value)}>
                <option value="default">默认排序</option>
                <option value="price-asc">价格从低到高</option>
                <option value="price-desc">价格从高到低</option>
                <option value="days">天数从少到多</option>
              </select>
            </div>
          </div>
          {results.length === 0 ? (
            <div className="no-results"><p>没有匹配的旅游产品，试试调整筛选条件</p></div>
          ) : (
            <div className="result-list">
              {results.map(item => (
                <div className="result-card" key={item.id}>
                  <img src={item.img} alt={item.title} />
                  <div className="result-info">
                    <h3>{item.title}</h3>
                    <p className="desc">{item.desc}</p>
                    <div className="result-meta">
                      <span>📍 {item.dest}</span>
                      <span>📅 {item.days} 天</span>
                    </div>
                  </div>
                  <div className="result-price">
                    <div className="price">¥{item.price.toLocaleString()}</div>
                    <div className="unit">起/人</div>
                    <button onClick={() => alert(`已选择「${item.title}」，即将跳转预订页面`)}>立即预订</button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
