<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
  background: #f5f6fa; color: #333; min-height: 100vh;
}

/* Header */
.list-header {
  background: linear-gradient(135deg, #1a1d28, #252a3a);
  color: #fff; padding: 32px 24px 28px; text-align: center;
  position: sticky; top: 0; z-index: 100;
}
.list-header h1 { font-size: 26px; font-weight: 800; }
.list-header p { font-size: 13px; opacity: 0.5; margin-top: 4px; }
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  color: rgba(255,255,255,0.6); font-size: 13px; margin-bottom: 12px;
  text-decoration: none; transition: color 0.2s;
}
.back-link:hover { color: #f39c12; }

/* Filters */
.filters-bar {
  max-width: 1200px; margin: 24px auto 0; padding: 0 24px;
  display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
}
.filters-bar select, .filters-bar input {
  padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px;
  font-size: 14px; outline: none; font-family: inherit; background: #fff;
}
.filters-bar select:focus, .filters-bar input:focus { border-color: #f39c12; }
.filters-bar .result-count { margin-left: auto; font-size: 14px; color: #888; }

/* Grid */
.list-container {
  max-width: 1200px; margin: 0 auto; padding: 28px 24px 80px;
}
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 20px;
}

/* Card */
.list-card {
  background: #fff; border-radius: 14px; overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.04); transition: transform 0.3s, box-shadow 0.3s;
  cursor: pointer;
}
.list-card:hover { transform: translateY(-4px); box-shadow: 0 8px 28px rgba(0,0,0,0.1); }
.list-card:active { transform: translateY(-4px); box-shadow: 0 8px 28px rgba(0,0,0,0.1); }
.list-card img {
  width: 100%; height: 220px; object-fit: cover; display: block;
}
.list-card-body { padding: 20px 24px 24px; }
.list-card-body h3 { font-size: 18px; font-weight: 700; color: #2c3e50; margin-bottom: 6px; }
.list-card-body .meta { font-size: 13px; color: #888; margin-bottom: 8px; display: flex; gap: 16px; flex-wrap: wrap; }
.list-card-body .desc { font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 12px; }
.list-card-footer { display: flex; justify-content: space-between; align-items: center; }
.list-card-footer .price { font-size: 22px; font-weight: 800; color: #e74c3c; }
.list-card-footer .price small { font-size: 12px; color: #999; font-weight: 400; }
.list-card-footer .btn {
  padding: 10px 24px; background: linear-gradient(135deg, #f39c12, #e67e22);
  color: #fff; border: none; border-radius: 50px; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
}
.list-card-footer .btn:hover { transform: scale(1.04); box-shadow: 0 4px 16px rgba(243,156,18,0.4); }

/* Guide card variant */
.guide-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}
.guide-list-card {
  background: #fff; border-radius: 16px; padding: 32px 24px; text-align: center;
  border: 1px solid #eee; cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
}
.guide-list-card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
.guide-list-card:active { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
.guide-list-card .guide-icon {
  width: 64px; height: 64px; margin: 0 auto 16px; background: #fff8e7;
  border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px;
}
.guide-list-card h3 { font-size: 17px; margin-bottom: 8px; color: #2c3e50; }
.guide-list-card p { color: #888; font-size: 13px; line-height: 1.5; }

/* Empty */
.empty-state { text-align: center; padding: 80px 20px; color: #bbb; }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }

/* Toast */
.search-toast {
  position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
  padding: 14px 28px; border-radius: 12px; font-size: 14px; font-weight: 600;
  z-index: 9999; box-shadow: 0 8px 28px rgba(0,0,0,0.18);
  display: none; white-space: nowrap;
}
.search-toast.show { display: block; }
.search-toast.error { background: #e74c3c; color: #fff; }
.search-toast.success { background: #27ae60; color: #fff; }
.search-toast.info { background: #2c3e50; color: #fff; }

/* Sort tabs */
.sort-tabs {
  max-width: 1200px; margin: 0 auto; padding: 0 24px;
  display: flex; gap: 0; position: relative;
  border-bottom: 2px solid #e8e0d5;
}
.sort-tab {
  padding: 10px 20px; font-size: 14px; font-weight: 600; color: #8b7e6a;
  cursor: pointer; border: none; background: none;
  transition: color 0.25s;
}
.sort-tab:hover, .sort-tab.active { color: #c67b4b; }

/* Pagination */
.pagination {
  max-width: 1200px; margin: 0 auto; padding: 0 24px 60px;
  display: flex; justify-content: center; align-items: center; gap: 6px;
}
.page-btn {
  min-width: 36px; height: 36px; padding: 0 10px; line-height: 36px; text-align: center;
  border: 1px solid #e0d5c5; background: #fffdf9; color: #8b7e6a;
  border-radius: 4px; font-size: 14px; cursor: pointer; transition: all 0.2s;
}
.page-btn:hover { border-color: #c67b4b; color: #c67b4b; }
.page-btn.active { background: #c67b4b; color: #fff; border-color: #c67b4b; }
.page-btn.disabled { opacity: 0.3; pointer-events: none; }

/* Region tags */
.region-tags {
  display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px;
}
.region-tag {
  padding: 8px 20px; border-radius: 50px; font-size: 14px; font-weight: 600;
  border: 2px solid #e0e0e0; background: #fff; color: #666; cursor: pointer;
  transition: all 0.2s; user-select: none;
}
.region-tag:hover { border-color: #f39c12; color: #f39c12; }
.region-tag.active { background: #f39c12; color: #fff; border-color: #f39c12; }

/* Detail overlay */
.detail-overlay {
  position: fixed; inset: 0; z-index: 2000; background: #f7f3ed;
  overflow-y: auto; display: none;
}
.detail-overlay.show { display: block; }
.detail-back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 2001;
  width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.4);
  color: #fff; border: none; font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.detail-hero {
  height: 360px; background-size: cover; background-position: center;
  position: relative; display: flex; align-items: flex-end;
}
.detail-hero::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(transparent 50%, rgba(0,0,0,0.55));
}
.detail-hero-content { position: relative; z-index: 1; padding: 32px 40px; color: #fff; }
.detail-hero-content h2 { font-size: 32px; font-weight: 800; font-family: 'Playfair Display', serif; }
.detail-hero-content .stars { font-size: 16px; color: #f39c12; }
.detail-body { max-width: 800px; margin: 0 auto; padding: 32px 24px 80px; }
.detail-body h3 { font-size: 20px; color: #3d3628; margin: 24px 0 10px; padding-bottom: 6px; border-bottom: 2px solid #c67b4b; display: inline-block; }
.detail-body .intro { font-size: 16px; color: #555; line-height: 1.8; }
.attraction-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.attraction-item { display: flex; align-items: center; gap: 10px; background: #fffdf9; padding: 12px 14px; border-radius: 6px; border: 1px solid #e8e0d5; font-size: 14px; }
.attraction-item .icon { font-size: 20px; flex-shrink: 0; }
.info-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.info-tag { background: #f5ede0; color: #8b5e3c; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; }
.tip-list { list-style: none; }
.tip-list li { padding: 10px 0; border-bottom: 1px solid #e8e0d5; font-size: 14px; color: #666; display: flex; gap: 8px; }
.tip-list li::before { content: '•'; color: #c67b4b; font-weight: bold; }
.detail-book-btn { display: inline-block; padding: 14px 40px; background: linear-gradient(135deg, #c67b4b, #a05a35); color: #fff; border: none; border-radius: 50px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 24px rgba(198,123,75,0.4); transition: all 0.3s; font-family: inherit; }
.detail-book-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(198,123,75,0.5); }
@media (max-width: 767px) {
  .detail-hero { height: 240px; }
  .detail-hero-content { padding: 20px 24px; }
  .detail-hero-content h2 { font-size: 24px; }
  .attraction-list { grid-template-columns: 1fr; }
}

/* Responsive */
@media (max-width: 767px) {
  .card-grid { grid-template-columns: 1fr; }
  .guide-grid { grid-template-columns: 1fr; }
  .list-card img { height: 180px; }
  .filters-bar { flex-direction: column; }
  .filters-bar .result-count { margin-left: 0; }
}
</style>

function showToast(msg, type) {
  const t = document.getElementById('searchToast');
  t.textContent = msg; t.className = 'search-toast ' + type + ' show';
  clearTimeout(t._tid); t._tid = setTimeout(() => t.classList.remove('show'), 2500);
}

function isLoggedIn() {
  return localStorage.getItem('loggedInUser') !== null;
}

function requireLogin(callback) {
  if (isLoggedIn()) { callback(); return; }

// ===== Render =====
function render() {
  const container = document.getElementById('listContainer');
  let list = data.items.slice();

  // Apply search filter from URL param
  if (type === 'destinations' && searchQuery) {
    list = list.filter(function(d) { return d.name.indexOf(searchQuery) !== -1; });
    activeRegion = '全部';
    document.querySelectorAll('.region-tag').forEach(function(t) { t.classList.remove('active'); });
    var allTag = document.querySelector('.region-tag[data-region="全部"]');
    if (allTag) allTag.classList.add('active');
  }

  // Apply filters first (before sort & pagination)
  if (type === 'destinations' && activeRegion !== '全部') {
    list = list.filter(function(d) { return regionMap[d.name] === activeRegion; });
  } else if (type === 'hotels') {
    if (activeFilter && activeFilter !== '全部') list = list.filter(function(h) { return h.loc.includes(activeFilter); });
  } else if (type === 'flights') {
    var fromVal = document.getElementById('filterFrom')?.value;
    var toVal = document.getElementById('filterTo')?.value;
    if (fromVal && fromVal !== '全部') list = list.filter(function(f) { return f.from === fromVal; });
    if (toVal && toVal !== '全部') list = list.filter(function(f) { return f.to === toVal; });
  } else if (type === 'cars') {
    if (activeFilter && activeFilter !== '全部') list = list.filter(function(c) { return c.type === activeFilter; });
  }

  // Sort
  if (sortMode === 'hot') { list.sort(function(a, b) { return b.price - a.price; }); }
  else if (sortMode === 'recommend') {
    if (type === 'hotels') list.sort(function(a, b) { return parseFloat(b.rating) - parseFloat(a.rating); });
    else if (type === 'destinations') list.sort(function(a, b) { return parseFloat((b.stars || '').split(' ')[1] || 0) - parseFloat((a.stars || '').split(' ')[1] || 0); });
    else if (type === 'cars') list.sort(function(a, b) { return b.seats - a.seats; });
    else list.sort(function(a, b) { return (b.direct ? 1 : 0) - (a.direct ? 1 : 0); });
  } else if (sortMode === 'recent') { list.reverse(); }

  // Paginate (after filter + sort)
  var totalPages = Math.ceil(list.length / pageSize);
  if (currentPage > totalPages) currentPage = totalPages || 1;
  var start = (currentPage - 1) * pageSize;
  var pagedList = list.slice(start, start + pageSize);

  // Update count
  var countEl = document.getElementById('resultCount');
  if (countEl) countEl.textContent = '共 ' + list.length + ' 条';

  if (!list.length) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>没有匹配的结果</p></div>';
    return;
  }

  // Guides use a different layout
  if (type === 'guides') {
    container.innerHTML = '<div class="guide-grid">' + pagedList.map(function(g) {
      return '<div class="guide-list-card"><div class="guide-icon">' + g.icon + '</div><h3>' + g.name + '</h3><p>' + g.desc + '</p></div>';
    }).join('') + '</div>';
    renderPagination(list.length);
    return;
  }

  // Destinations use a specific layout
  if (type === 'destinations') {
    container.innerHTML = '<div class="card-grid">' + pagedList.map(function(d) {
      var destId = destNameToId[d.name] || '';
      var onclick = destId ? ' onclick="showDestDetail(\'' + destId + '\')"' : '';
      return '<div class="list-card"' + onclick + '><img src="https://picsum.photos/seed/' + d.img + '/600/400" alt="' + d.name + '" loading="lazy"><div class="list-card-body"><h3>' + d.name + '</h3><div class="meta"><span style="color:#f39c12">' + d.stars + '</span></div><p class="desc">' + d.desc + '</p></div></div>';
    }).join('') + '</div>';
    renderPagination(list.length);
    return;
  }

  // Hotels
  if (type === 'hotels') {
    container.innerHTML = `<div class="card-grid">${pagedList.map(h => `
      <div class="list-card">
        <img src="https://picsum.photos/seed/${h.img}/600/400" alt="${h.name}" loading="lazy">
        <div class="list-card-body">
          <h3>${h.name} <span style="color:#f39c12;font-size:14px">${'★'.repeat(h.stars)}</span></h3>
          <div class="meta">
            <span>📍 ${h.loc}</span>
            <span>⭐ ${h.rating} 分</span>
          </div>
          <div class="meta">${h.features.map(f => `<span style="font-size:11px;padding:2px 8px;border-radius:10px;background:#f0f2f5;color:#666;">${f}</span>`).join(' ')}</div>
          <div class="list-card-footer">
            <div class="price">¥${h.price.toLocaleString()} <small>${data.unit}</small></div>
            <button class="btn" onclick="requireLogin(() => showToast('已选择「${h.name}」', 'success'))">预订</button>
          </div>
        </div>
      </div>
    `).join('')}</div>`;
    renderPagination(list.length);
    return;
  }

  // Flights
  if (type === 'flights') {
    container.innerHTML = `<div class="card-grid">${pagedList.map(f => `
      <div class="list-card">
        <img src="https://picsum.photos/seed/${f.img}/600/400" alt="${f.from}→${f.to}" loading="lazy">
        <div class="list-card-body">
          <h3>${f.from} → ${f.to}</h3>
          <div class="meta">
            <span>🛫 ${f.airline}</span>
            <span>📅 ${f.date}</span>
            <span>🕐 ${f.time}</span>
          </div>
          <div class="meta">
            <span style="font-size:11px;padding:2px 8px;border-radius:10px;background:#f0f2f5;color:#666;">⏱ ${f.duration}</span>
            <span style="font-size:11px;padding:2px 8px;border-radius:10px;background:${f.direct?'#e8f8e8':'#fff3e0'};color:${f.direct?'#27ae60':'#e67e22'};">${f.direct?'直飞':'中转'}</span>
          </div>
          <div class="list-card-footer">
            <div class="price">¥${f.price.toLocaleString()} <small>${data.unit}</small></div>
            <button class="btn" onclick="requireLogin(() => showToast('已选择「${f.from}→${f.to}」', 'success'))">预订</button>
          </div>
        </div>
      </div>
    `).join('')}</div>`;
    renderPagination(list.length);
    return;
  }

  // Cars (default)
  container.innerHTML = '<div class="card-grid">' + pagedList.map(function(c) {
    var featuresHtml = c.features.map(function(f) { return '<span style=\"font-size:11px;padding:2px 8px;border-radius:10px;background:#f0f2f5;color:#666;\">' + f + '</span>'; }).join(' ');
    return '<div class=\"list-card\"><img src=\"https://picsum.photos/seed/' + c.img + '/600/400\" alt=\"' + c.name + '\" loading=\"lazy\"><div class=\"list-card-body\"><h3>' + c.name + '</h3><div class=\"meta\"><span>🚘 ' + c.type + '</span><span>🪑 ' + c.seats + '座</span><span>⚙ ' + c.trans + '</span></div><div class=\"meta\">' + featuresHtml + '</div><div class=\"list-card-footer\"><div class=\"price\">¥' + c.price.toLocaleString() + ' <small>' + data.unit + '</small></div><button class=\"btn\" onclick=\"requireLogin(function() { showToast(\'已选择「' + c.name + '」\', \'success\'); })\">预订</button></div></div></div>';
  }).join('') + '</div>';
  renderPagination(list.length);
}

(function setupSortTabs() {
  var tabs = ['最新', '最热', '推荐'];

  var html = '';
  for (var i = 0; i < tabs.length; i++) {
    html += '<button class="sort-tab' + (i === 0 ? ' active' : '') + '">' + tabs[i] + '</button>';
  }
  container.innerHTML = html;
  var btns = container.querySelectorAll('.sort-tab');
  for (var j = 0; j < btns.length; j++) {
    btns[j].addEventListener('click', function(idx) {
      return function() {
        for (var k = 0; k < btns.length; k++) { btns[k].classList.remove('active'); }
        btns[idx].classList.add('active');
        sortMode = ['recent', 'hot', 'recommend'][idx];
        currentPage = 1;
        render();
      };
    }(j));
  }
})();

function renderPagination(totalItems) {
  var totalPages = Math.ceil(totalItems / pageSize);
  if (totalPages < 1) totalPages = 1;
  if (currentPage > totalPages) currentPage = totalPages;
  var pagEl = document.getElementById('pagination');
  if (totalPages <= 1) { pagEl.innerHTML = ''; return; }
  var h = '';
  h += '<span class="page-btn' + (currentPage <= 1 ? ' disabled' : '') + '" data-page="1">«</span>';
  h += '<span class="page-btn' + (currentPage <= 1 ? ' disabled' : '') + '" data-page="' + (currentPage - 1) + '">‹</span>';
  for (var p = 1; p <= totalPages; p++) {
    if (p === 1 || p === totalPages || (p >= currentPage - 2 && p <= currentPage + 2)) {
      h += '<span class="page-btn' + (p === currentPage ? ' active' : '') + '" data-page="' + p + '">' + p + '</span>';
    } else if (p === currentPage - 3 || p === currentPage + 3) {
      h += '<span>…</span>';
    }
  }
  h += '<span class="page-btn' + (currentPage >= totalPages ? ' disabled' : '') + '" data-page="' + (currentPage + 1) + '">›</span>';
  h += '<span class="page-btn' + (currentPage >= totalPages ? ' disabled' : '') + '" data-page="' + totalPages + '">»</span>';
  pagEl.innerHTML = h;
  var btns = pagEl.querySelectorAll('.page-btn');
  for (var b = 0; b < btns.length; b++) {
    btns[b].addEventListener('click', function() {
      var p = parseInt(this.getAttribute('data-page'));
      if (!isNaN(p) && p >= 1 && p <= totalPages) { currentPage = p; render(); }
    });
  }
}

  if (e.target.closest('.btn')) gsap.to(e.target.closest('.btn'), { scale: 1.05, duration: 0.2, ease: 'power2.out' });
}, true);
document.body.addEventListener('mouseleave', e => {
  if (e.target.closest('.btn')) gsap.to(e.target.closest('.btn'), { scale: 1, duration: 0.2, ease: 'power2.out' });
}, true);
document.body.addEventListener('mousedown', e => {
  if (e.target.closest('.btn')) gsap.to(e.target.closest('.btn'), { scale: 0.95, duration: 0.08, ease: 'power2.in' });
}, true);
document.body.addEventListener('mouseup', e => {
  if (e.target.closest('.btn')) gsap.to(e.target.closest('.btn'), { scale: 1.05, duration: 0.12, ease: 'power2.out' });
}, true);

// Region tag active state animation
document.querySelectorAll('.region-tag').forEach(tag => {
  tag.addEventListener('click', () => {
    gsap.fromTo(tag, { scale: 0.9 }, { scale: 1, duration: 0.3, ease: 'back.out(2)' });
  });
});

// Toast GSAP override
var _origToast = showToast;
showToast = function(msg, type) {
  var t = document.getElementById('searchToast');
  t.textContent = msg;
  t.className = 'search-toast ' + type + ' show';
  t.style.display = '';
  gsap.fromTo(t, { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.3, ease: 'back.out(1.4)' });
  clearTimeout(t._tid);
  t._tid = setTimeout(function() {
    t.classList.remove('show');
  }, 2500);
};
</script>
</body>
</html>
